name: Build allocator for CounterStrikeSharp 375

on:
  push:
    branches: ["main", "jumper/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test existing allocator and compatibility regressions
        run: dotnet test RetakesAllocatorTest/RetakesAllocatorTest.csproj -c Release --logger "trx;LogFileName=linux-regression.trx"
      - name: Build plugin
        run: dotnet build RetakesAllocator/RetakesAllocator.csproj -c Release
      - name: Package Linux x64 plugin
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: RetakesAllocator-2.4.2-jumper.1-linux-x64
          path: artifacts/*.zip
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-test-results
          path: RetakesAllocatorTest/TestResults/*.trx
